name: Publish Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v3.1.0

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test timer
        run: npm test
      - name: Build portable Windows app
        run: npm run dist:win:portable
      - name: Retain downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Beat-Windows
          path: release/*-win.zip
          if-no-files-found: error
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $archive = Get-ChildItem 'release/*-win.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows ZIP is missing' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "Focus Beat $env:RELEASE_TAG" --notes "New Tasks tab between Sound Studio and Progress, with offline checklists for each activity. Add, edit, complete, reopen, delete, and filter tasks, or select one as your focus goal. Checklists are saved locally and included in backups. Existing goal drafts migrate into tasks. Pace adjustment has been removed. Includes all previous activity mixes and stronger animated waves. Download the ZIP, extract all files, and launch Focus Beat.exe. This build is unsigned."
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
