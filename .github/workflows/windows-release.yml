name: Publish Windows app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v3.1.3

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test timer
        run: npm test
      - name: Build Windows installer and ZIP
        shell: pwsh
        run: |
          cmd /d /c "npm run dist:win:release > windows-build.log 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content windows-build.log
          if ($buildExit -ne 0) {
            $detail = (Get-Content windows-build.log -Tail 60) -join "`n"
            $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::Windows packaging failed: $escaped"
            exit 1
          }
      - name: Verify executable privilege manifests
        run: node scripts/check-windows-executables.cjs
      - name: Retain downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Beat-Windows
          path: |
            release/*-win.zip
            release/Focus-Beat-Setup-*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $archive = Get-ChildItem 'release/*-win.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows ZIP is missing' }
          $installer = Get-ChildItem 'release/Focus-Beat-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive.FullName $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive.FullName $installer.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "Focus Beat $env:RELEASE_TAG" --notes "Download Focus-Beat-Setup to install Focus Beat for your Windows account without extracting a ZIP. The installer and app run without requesting administrator privileges during normal installation and launch. This build is unsigned, so Windows may show an Unknown publisher or SmartScreen warning. The optional ZIP is also available. Fixes saved Study and Work profiles retaining 10/3/10 from the removed Short sprint preset: old pace preset timings now migrate to 25/5/15 while keeping tasks, history, and audio preferences. Includes activity checklists, 120 tracks, distinct profile mixes, and animated themes."
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
